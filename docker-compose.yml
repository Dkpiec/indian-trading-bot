# Indian Trading Bot — Isolated Docker Compose
# NEW project, no shared networks with existing containers
version: "3.9"

services:
  indian-trading-bot:
    build: .
    container_name: indian-trading-bot
    restart: unless-stopped
    ports:
      - "8050:8000"
    env_file:
      - /opt/data/secrets/coolify.env
    volumes:
      - /opt/data/scripts:/opt/data/scripts:ro
      - /opt/data/secrets:/opt/data/secrets
      - /opt/data/.venv:/opt/data/.venv:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://itb_user:itb_pass@indian-trading-bot-postgres:5432/indian_trading_bot_db
      - REDIS_URL=redis://indian-trading-bot-redis:6379/0
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - TZ=Asia/Kolkata
    depends_on:
      indian-trading-bot-postgres:
        condition: service_healthy
      indian-trading-bot-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  indian-trading-bot-postgres:
    image: postgres:16-alpine
    container_name: indian-trading-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: indian_trading_bot_db
      POSTGRES_USER: itb_user
      POSTGRES_PASSWORD: itb_pass
    volumes:
      - itb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itb_user -d indian_trading_bot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  indian-trading-bot-redis:
    image: redis:7-alpine
    container_name: indian-trading-bot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  itb_pgdata: