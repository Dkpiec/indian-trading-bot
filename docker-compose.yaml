version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itb-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - coolify
    env_file:
      - /opt/data/secrets/coolify.env
    volumes:
      - /opt/data/secrets:/opt/data/secrets:ro
    environment:
      - TRADING_BOT_POLLING=1
networks:
  coolify:
    external: true
