# Ruff config for Indian Trading Bot.
#
# CI gates on GENUINE BUGS only (undefined names, unused imports,
# exception chaining, redefinition). Style-flavoured rules that are noisy in
# this numeric/strategy codebase (ambiguous loop-var names, unused-but-
# intentional locals, DB boolean comparisons) are demoted to "warning" via
# per-rule configuration so they show up but never block a deploy.
line-length = 100

# Never lint/format vendored third-party or auto-generated code.
extend-exclude = ["wheelhouse", "alembic/versions"]

[lint]
# Real-bug rules (hard gate in CI).
select = [
    "F",   # pyflakes: undefined names, unused imports, redefinition
    "B",   # flake8-bugbear: real bug patterns
    "E",   # pycodestyle errors
    "W",   # warnings
]
# Ignore the rules that are mostly style noise / false-positives in this
# codebase. They are NOT selected, so they can't block a deploy.
ignore = [
    "E501",   # line length (style, not a bug)
    "E402",   # module-level import not at top (guarded / TYPE_CHECKING)
    "E401",   # multiple imports on one line (pre-existing import style)
    "B008",   # default mutable call args (PTB handler style)
    "E741",   # ambiguous names (l/c used for long/close in candle logic)
    "E712",   # == True (intentional DB boolean checks in SQLAlchemy)
    "E711",   # == None (same)
    "F401",   # unused imports (pre-existing; harmless — keep the gate bug-focused)
    "F841",   # unused local vars (several are intentional / reserved)
    "B007",   # unused loop control var (iteration-for-side-effect pattern)
    "W291", "W292", "W293", "W291",  # trailing/blank-line whitespace
    "E701", "E702",  # statement spacing (style)
]

[lint.isort]
known-first-party = ["core", "layers", "rpc", "catalog", "tests"]

[lint.pyupgrade]
keep-runtime-typing = false
